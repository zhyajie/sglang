<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-1%" y="-1%" width="102%" height="102%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="heatHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="heatMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">STA Core Insight: 3D Attention Locality in Video DiTs</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#94a3b8">Attention scores concentrate within local spatiotemporal windows (>90% of mass)</text>

  <!-- Left panel: 3D attention distribution -->
  <rect x="30" y="75" width="400" height="380" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" filter="url(#sh)"/>
  <text x="230" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Attention Score Distribution</text>
  <text x="230" y="118" text-anchor="middle" font-size="11" fill="#64748b">For a query token at position (t, h, w)</text>

  <!-- Simulated heatmap grid -->
  <g transform="translate(70, 140)">
    <!-- Grid labels -->
    <text x="140" y="-8" text-anchor="middle" font-size="11" fill="#64748b">Key Token Position (flattened)</text>
    <text x="-25" y="120" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90, -25, 120)">Query Rows</text>

    <!-- Row of cells - simulating attention heatmap -->
    <!-- Row 1: far from query -->
    <rect x="0" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="14" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="30" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="44" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="60" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="74" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="90" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="104" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="120" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="134" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="150" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="164" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="180" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="194" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="210" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="224" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="240" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="254" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="270" y="0" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="284" y="15" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>

    <!-- Row 2 -->
    <rect x="0" y="24" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="14" y="39" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="30" y="24" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="44" y="39" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="60" y="24" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="74" y="39" text-anchor="middle" font-size="7" fill="#92400e">0.02</text>
    <rect x="90" y="24" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="104" y="39" text-anchor="middle" font-size="7" fill="#92400e">0.03</text>
    <rect x="120" y="24" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="134" y="39" text-anchor="middle" font-size="7" fill="#9a3412">0.05</text>
    <rect x="150" y="24" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="164" y="39" text-anchor="middle" font-size="7" fill="#92400e">0.03</text>
    <rect x="180" y="24" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="194" y="39" text-anchor="middle" font-size="7" fill="#92400e">0.02</text>
    <rect x="210" y="24" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="224" y="39" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="240" y="24" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="254" y="39" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="270" y="24" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="284" y="39" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>

    <!-- Row 3: near query - high attention -->
    <rect x="0" y="48" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="14" y="63" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="30" y="48" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="44" y="63" text-anchor="middle" font-size="7" fill="#92400e">0.03</text>
    <rect x="60" y="48" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="74" y="63" text-anchor="middle" font-size="7" fill="#9a3412">0.06</text>
    <rect x="90" y="48" width="28" height="22" fill="#fca5a5" stroke="#ef4444" rx="2"/><text x="104" y="63" text-anchor="middle" font-size="7" fill="#7f1d1d">0.12</text>
    <rect x="120" y="48" width="28" height="22" fill="#ef4444" stroke="#dc2626" rx="2"/><text x="134" y="63" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">0.25</text>
    <rect x="150" y="48" width="28" height="22" fill="#fca5a5" stroke="#ef4444" rx="2"/><text x="164" y="63" text-anchor="middle" font-size="7" fill="#7f1d1d">0.10</text>
    <rect x="180" y="48" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="194" y="63" text-anchor="middle" font-size="7" fill="#9a3412">0.05</text>
    <rect x="210" y="48" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="224" y="63" text-anchor="middle" font-size="7" fill="#92400e">0.02</text>
    <rect x="240" y="48" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="254" y="63" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="270" y="48" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="284" y="63" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>

    <!-- Row 4: query row - peak attention -->
    <rect x="0" y="72" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="14" y="87" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="30" y="72" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="44" y="87" text-anchor="middle" font-size="7" fill="#9a3412">0.04</text>
    <rect x="60" y="72" width="28" height="22" fill="#fca5a5" stroke="#ef4444" rx="2"/><text x="74" y="87" text-anchor="middle" font-size="7" fill="#7f1d1d">0.09</text>
    <rect x="90" y="72" width="28" height="22" fill="#ef4444" stroke="#dc2626" rx="2"/><text x="104" y="87" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">0.18</text>
    <rect x="120" y="72" width="28" height="22" fill="#b91c1c" stroke="#991b1b" rx="2"/><text x="134" y="87" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">0.42</text>
    <rect x="150" y="72" width="28" height="22" fill="#ef4444" stroke="#dc2626" rx="2"/><text x="164" y="87" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">0.15</text>
    <rect x="180" y="72" width="28" height="22" fill="#fca5a5" stroke="#ef4444" rx="2"/><text x="194" y="87" text-anchor="middle" font-size="7" fill="#7f1d1d">0.08</text>
    <rect x="210" y="72" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="224" y="87" text-anchor="middle" font-size="7" fill="#9a3412">0.03</text>
    <rect x="240" y="72" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="254" y="87" text-anchor="middle" font-size="7" fill="#cbd5e1">0.01</text>
    <rect x="270" y="72" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="284" y="87" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>

    <!-- Row 5 -->
    <rect x="0" y="96" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="14" y="111" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="30" y="96" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="44" y="111" text-anchor="middle" font-size="7" fill="#92400e">0.03</text>
    <rect x="60" y="96" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="74" y="111" text-anchor="middle" font-size="7" fill="#9a3412">0.06</text>
    <rect x="90" y="96" width="28" height="22" fill="#fca5a5" stroke="#ef4444" rx="2"/><text x="104" y="111" text-anchor="middle" font-size="7" fill="#7f1d1d">0.10</text>
    <rect x="120" y="96" width="28" height="22" fill="#ef4444" stroke="#dc2626" rx="2"/><text x="134" y="111" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">0.20</text>
    <rect x="150" y="96" width="28" height="22" fill="#fca5a5" stroke="#ef4444" rx="2"/><text x="164" y="111" text-anchor="middle" font-size="7" fill="#7f1d1d">0.08</text>
    <rect x="180" y="96" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/><text x="194" y="111" text-anchor="middle" font-size="7" fill="#9a3412">0.04</text>
    <rect x="210" y="96" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/><text x="224" y="111" text-anchor="middle" font-size="7" fill="#92400e">0.02</text>
    <rect x="240" y="96" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="254" y="111" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>
    <rect x="270" y="96" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/><text x="284" y="111" text-anchor="middle" font-size="7" fill="#cbd5e1">0.00</text>

    <!-- Rows 6-8: far again -->
    <rect x="0" y="120" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="30" y="120" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="60" y="120" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/>
    <rect x="90" y="120" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/>
    <rect x="120" y="120" width="28" height="22" fill="#fed7aa" stroke="#f97316" rx="2"/>
    <rect x="150" y="120" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/>
    <rect x="180" y="120" width="28" height="22" fill="#fef9c3" stroke="#fcd34d" rx="2"/>
    <rect x="210" y="120" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="240" y="120" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="270" y="120" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>

    <rect x="0" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="30" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="60" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="90" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="120" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="150" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="180" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="210" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="240" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>
    <rect x="270" y="144" width="28" height="22" fill="#f1f5f9" stroke="#e2e8f0" rx="2"/>

    <!-- Window boundary -->
    <rect x="55" y="19" width="180" height="127" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3" rx="4"/>
    <text x="145" y="165" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="bold">Local Window</text>
  </g>

  <!-- Heat legend -->
  <g transform="translate(80, 382)">
    <rect x="0" y="0" width="30" height="12" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="30" y="0" width="30" height="12" fill="#fef9c3" stroke="#fcd34d"/>
    <rect x="60" y="0" width="30" height="12" fill="#fed7aa" stroke="#f97316"/>
    <rect x="90" y="0" width="30" height="12" fill="#fca5a5" stroke="#ef4444"/>
    <rect x="120" y="0" width="30" height="12" fill="#ef4444" stroke="#dc2626"/>
    <rect x="150" y="0" width="30" height="12" fill="#b91c1c" stroke="#991b1b"/>
    <text x="0" y="24" font-size="9" fill="#94a3b8">Low</text>
    <text x="180" y="24" text-anchor="end" font-size="9" fill="#94a3b8">High</text>
    <text x="90" y="24" text-anchor="middle" font-size="9" fill="#64748b">Attention Score</text>
  </g>

  <!-- Right panel: Key insight -->
  <rect x="460" y="75" width="410" height="380" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" filter="url(#sh)"/>
  <text x="665" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Why This Enables Acceleration</text>

  <!-- Insight 1 -->
  <g transform="translate(480, 118)">
    <circle cx="12" cy="12" r="12" fill="#22c55e"/>
    <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
    <text x="32" y="11" font-size="13" font-weight="bold" fill="#166534">90%+ attention in local window</text>
    <text x="32" y="28" font-size="11" fill="#475569">A small 3D window (e.g., 3x3x3 tiles)</text>
    <text x="32" y="43" font-size="11" fill="#475569">captures most attention mass.</text>
    <text x="32" y="58" font-size="11" fill="#475569">Distant tokens contribute near-zero.</text>
  </g>

  <!-- Insight 2 -->
  <g transform="translate(480, 195)">
    <circle cx="12" cy="12" r="12" fill="#3b82f6"/>
    <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
    <text x="32" y="11" font-size="13" font-weight="bold" fill="#1e40af">Pattern is prompt-agnostic</text>
    <text x="32" y="28" font-size="11" fill="#475569">Tested across 10 diverse prompts:</text>
    <text x="32" y="43" font-size="11" fill="#475569">the locality pattern has very low</text>
    <text x="32" y="58" font-size="11" fill="#475569">standard deviation. No per-prompt tuning.</text>
  </g>

  <!-- Insight 3 -->
  <g transform="translate(480, 272)">
    <circle cx="12" cy="12" r="12" fill="#f97316"/>
    <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
    <text x="32" y="11" font-size="13" font-weight="bold" fill="#9a3412">Skip = Free speedup</text>
    <text x="32" y="28" font-size="11" fill="#475569">Skipping tiles outside the window</text>
    <text x="32" y="43" font-size="11" fill="#475569">costs zero compute. At 91% sparsity,</text>
    <text x="32" y="58" font-size="11" fill="#475569">only 27/300 tiles are computed.</text>
  </g>

  <!-- Stats box -->
  <rect x="480" y="350" width="370" height="88" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="8"/>
  <text x="665" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Paper Findings (HunyuanVideo)</text>
  <text x="500" y="396" font-size="12" fill="#334155">Window coverage: <tspan font-weight="bold" fill="#dc2626">15.52%</tspan> of token space</text>
  <text x="500" y="414" font-size="12" fill="#334155">Attention captured: <tspan font-weight="bold" fill="#dc2626">70%+</tspan> of total mass</text>
  <text x="500" y="432" font-size="12" fill="#334155">Quality loss (VBench): <tspan font-weight="bold" fill="#16a34a">-0.09%</tspan> (negligible)</text>
</svg>
